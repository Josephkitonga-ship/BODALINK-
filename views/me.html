<div class="page stack-lg">
  <div class="card row">
    <div class="avatar" id="mAv"></div>
    <div class="grow"><h3 id="mName"></h3><p class="muted small" id="mPhone"></p></div>
    <span class="badge" id="mBadge"></span>
  </div>
  <div class="card stack" id="mPass" hidden>
    <h3>Identity and safety</h3>
    <p class="hint">Your phone number is verified. Adding your ID earns a verified badge once BodaLink confirms it.</p>
    <div class="field"><label for="mNid">National ID number</label><input class="input" id="mNid" inputmode="numeric" maxlength="10"></div>
    <div class="field"><label for="mEn">Emergency contact name</label><input class="input" id="mEn"></div>
    <div class="field"><label for="mEp">Emergency contact phone</label><input class="input" id="mEp" type="tel"></div>
    <button class="btn btn--dark" id="mSave">Save</button>
  </div>
  <div class="card stack" id="mRider" hidden>
    <h3>Rider verification</h3>
    <p class="hint" id="mRiderMsg"></p>
    <a class="btn btn--green" href="#/join">Open my checklist</a>
  </div>
  <div class="card stack">
    <h3>App</h3>
    <button class="btn btn--soft" id="mPush">Turn on job and trip alerts</button>
    <button class="btn btn--soft" id="mInstall" hidden>Install BodaLink on your phone</button>
    <button class="btn btn--danger" id="mOut">Sign out</button>
  </div>
</div>
