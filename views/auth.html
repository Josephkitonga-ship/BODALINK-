<div class="page">
  <div class="card stack">
    <div class="seg" id="aTabs" role="group" aria-label="Account">
      <button data-m="login" aria-pressed="true">Sign in</button>
      <button data-m="register" aria-pressed="false">Create account</button>
    </div>

    <form id="fLogin" class="stack" novalidate>
      <div class="field"><label for="lPhone">Phone number</label><input class="input" id="lPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678"></div>
      <div class="field"><label for="lPin">6 digit PIN</label><input class="input pin" id="lPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
      <button class="btn btn--green btn--lg btn--block" type="submit">Sign in</button>
      <button class="btn btn--soft btn--block" type="button" id="toReset">Forgot your PIN?</button>
    </form>

    <form id="fReg" class="stack" hidden novalidate>
      <div class="stack" data-step="1">
        <h3>How will you use BodaLink?</h3>
        <button class="btn btn--soft btn--block role" type="button" data-role="passenger"><span><b>I need a ride or a delivery</b><br><small class="muted">Passenger or merchant</small></span></button>
        <button class="btn btn--soft btn--block role" type="button" data-role="rider"><span><b>I ride a boda</b><br><small class="muted">Rider, ID and bike check required</small></span></button>
      </div>
      <div class="stack" data-step="2" hidden>
        <div class="field"><label for="rName">Full name, as on your ID</label><input class="input" id="rName" autocomplete="name"></div>
        <div class="field"><label for="rPhone">Phone number (M-Pesa for riders)</label><input class="input" id="rPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678"></div>
        <div class="stack" id="rRider" hidden>
          <div class="field"><label for="rNid">National ID number</label><input class="input" id="rNid" inputmode="numeric" maxlength="10"></div>
          <div class="field"><label for="rPlate">Motorbike registration</label><input class="input" id="rPlate" autocapitalize="characters" placeholder="KMGH 214T"></div>
        </div>
        <div class="stack" id="rPass" hidden>
          <p class="hint">Optional but recommended: someone we can tell if something goes wrong on a trip.</p>
          <div class="field"><label for="rEName">Emergency contact name</label><input class="input" id="rEName"></div>
          <div class="field"><label for="rEPhone">Emergency contact phone</label><input class="input" id="rEPhone" type="tel" inputmode="tel"></div>
        </div>
        <button class="btn btn--green btn--lg btn--block" type="submit">Send my code</button>
        <button class="btn btn--soft btn--block" type="button" data-back>Back</button>
      </div>
      <div class="stack" data-step="3" hidden>
        <p class="hint" id="rSent"></p>
        <div class="field"><label for="rCode">6 digit code from SMS</label><input class="input pin" id="rCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
        <div class="field"><label for="rPin">Choose a 6 digit PIN</label><input class="input pin" id="rPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
        <div class="field"><label for="rPin2">Repeat your PIN</label><input class="input pin" id="rPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
        <button class="btn btn--green btn--lg btn--block" type="submit">Create my account</button>
        <button class="btn btn--soft btn--block" type="button" data-back>Back</button>
      </div>
    </form>

    <form id="fReset" class="stack" hidden novalidate>
      <h3>Reset your PIN</h3>
      <div class="field"><label for="pPhone">Phone number</label><input class="input" id="pPhone" type="tel" inputmode="tel"></div>
      <button class="btn btn--dark btn--block" type="button" id="pSend">Send my code</button>
      <div class="field"><label for="pCode">6 digit code</label><input class="input pin" id="pCode" inputmode="numeric" maxlength="6"></div>
      <div class="field"><label for="pPin">New 6 digit PIN</label><input class="input pin" id="pPin" type="password" inputmode="numeric" maxlength="6"></div>
      <button class="btn btn--green btn--lg btn--block" type="submit">Save new PIN</button>
      <button class="btn btn--soft btn--block" type="button" id="toLogin">Back to sign in</button>
    </form>
  </div>
</div>
