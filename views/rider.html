<div class="page stack-lg">
  <div id="rDeck"></div>
  <div id="rBanner"></div>
  <div class="card stack" id="rStatus">
    <div class="row between"><div><p class="muted small" id="rHello"></p><h2 id="rState">You are offline</h2></div><span class="badge" id="rPlate"></span></div>
    <button class="btn btn--green btn--lg btn--block go" id="rGo">Go online</button>
    <div class="row between"><span class="label">Your location</span><b id="rLoc"></b></div>
    <div class="row between"><span class="label">Day pass</span><b id="rPass"></b></div>
    <p class="hint" id="rPassHint"></p>
  </div>
  <div id="rActive"></div>
  <div>
    <div class="row between"><h3>Jobs near you</h3><span class="badge" id="rCount">0</span></div>
    <div id="rJobs" class="stack" style="margin-top:10px"></div>
  </div>
</div>
