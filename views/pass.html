<div class="page stack-lg">
  <div class="card stack">
    <p class="muted small">Your day pass</p>
    <h1 id="pStatus">No active pass</h1>
    <p class="hint" id="pHint"></p>
    <button class="btn btn--green btn--lg btn--block" id="pBuy">Buy day pass</button>
    <p class="hint" id="pMsg" hidden></p>
  </div>
  <div class="row" style="gap:12px">
    <div class="card card--flat grow"><p class="muted small">Earned today</p><b class="money" id="eToday" style="font-size:22px">KSh 0</b></div>
    <div class="card card--flat grow"><p class="muted small">Earned this week</p><b class="money" id="eWeek" style="font-size:22px">KSh 0</b></div>
  </div>
  <p class="hint" style="margin-top:-8px">Earnings are the prices you set on finished jobs. You keep all of it, BodaLink takes no cut from fares.</p>
  <div><h3>Pass history</h3><div id="pLedger" style="margin-top:6px"></div></div>
</div>
