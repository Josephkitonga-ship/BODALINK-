<div class="page stack-lg">
  <div class="card stack">
    <p class="muted small">Float balance</p>
    <h1 class="money" id="fBal">KSh 0</h1>
    <div class="bar"><i id="fBar"></i><b id="fMin"></b></div>
    <p class="hint" id="fHint"></p>
  </div>
  <div class="card stack">
    <h3>Top up with M-Pesa</h3>
    <div class="chips" id="fChips" role="group" aria-label="Amount"></div>
    <div class="field"><label for="fAmt">Or type an amount</label><input class="input" id="fAmt" inputmode="numeric" placeholder="KSh 300"></div>
    <button class="btn btn--green btn--lg btn--block" id="fGo">Send M-Pesa prompt</button>
    <p class="hint" id="fMsg" hidden></p>
  </div>
  <div class="row" style="gap:12px">
    <div class="card card--flat grow"><p class="muted small">Earned today</p><b class="money" id="eToday" style="font-size:22px">KSh 0</b></div>
    <div class="card card--flat grow"><p class="muted small">Earned this week</p><b class="money" id="eWeek" style="font-size:22px">KSh 0</b></div>
  </div>
  <div><h3>Float history</h3><div id="fLedger" style="margin-top:6px"></div></div>
</div>
